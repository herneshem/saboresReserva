
<div class="login-container">
  <form class="login-card" (ngSubmit)="iniciarSesion()">
    <h1>Acceso al personal</h1>
    <p>Administración de reservas</p>

    <label for="usuario">Usuario</label>
      <!-- placeholder="adminSabores" PARA PRUEBA -->
    <input
      id="usuario"
      type="text"
      name="usuario"
      [(ngModel)]="usuario"
      required
      autocomplete="username"
      placeholder="admin"
    />

    <label for="password">Contraseña</label>
      <!-- placeholder="adminSabores" PARA PRUEBA -->
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
      autocomplete="current-password"
      placeholder="adminSabores" 
    />

    <button type="submit">Iniciar sesión</button>

    <p *ngIf="mensaje" class="mensaje-exito">
  {{ mensaje }}
</p>

<p *ngIf="error" class="mensaje-error">
  {{ error }}
</p>
  </form>
</div>
